<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion — {{ site_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="login-scene">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-dot">{{ site_name[:2] | upper }}</div>
                <h1>{{ site_name }}</h1>
                <p class="sub">Espace de gestion</p>
            </div>

            {% if erreur %}
                <div class="alert alert-danger text-center py-2" style="border-radius: var(--r); font-size: 13px;">{{ erreur }}</div>
            {% endif %}

            <form method="POST" style="display: flex; flex-direction: column; gap: 18px;">
                <div>
                    <label for="username" class="form-label">Identifiant</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" id="username" class="form-control" placeholder="Identifiant" required autofocus>
                    </div>
                </div>

                <div>
                    <label for="password" class="form-label">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Mot de passe" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword" tabindex="-1" aria-label="Afficher le mot de passe">
                            <i class="fas fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember" id="remember" value="1">
                    <label class="form-check-label" for="remember">Rester connectée sur cet appareil</label>
                </div>

                <button type="submit" class="btn btn-brand btn-lg w-100" style="justify-content: center; margin-top: 6px;">
                    Se connecter
                    <i class="fas fa-arrow-right" style="font-size: 13px; margin-left: 8px;"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        // Bouton œil : afficher/masquer le mot de passe
        document.getElementById('togglePassword').addEventListener('click', function () {
            var input = document.getElementById('password');
            var icon = document.getElementById('togglePasswordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });
    </script>
</body>
</html>
