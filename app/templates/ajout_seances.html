{% extends 'layout.html' %}
{% import '_macros.html' as m %}

{% block page_title %}Ajout séances{% endblock %}
{% block page_name %}Ajout séances{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-9 col-lg-8 col-xl-7">

        <div class="card">
            <div class="card-body p-4 p-md-5">

                <form method="post" style="display: flex; flex-direction: column; gap: 24px;">

                    <div>
                        <div style="text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px;
                                    font-weight: 700; color: var(--olive); margin-bottom: 12px;">
                            Client
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="prenom" class="form-label">Prénom</label>
                                <input type="text" class="form-control" id="prenom" name="prenom" placeholder="Ex : Marie" required>
                            </div>
                            <div class="col-md-6">
                                <label for="nom" class="form-label">Nom</label>
                                <input type="text" class="form-control" id="nom" name="nom" placeholder="Ex : Dupont" required>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div style="text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px;
                                    font-weight: 700; color: var(--olive); margin-bottom: 12px;">
                            Forfait acheté
                        </div>
                        {{ m.pack_selector(default='10', uid='as') }}
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-2" style="border-top: 1px solid var(--border); padding-top: 20px;">
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-brand">
                            <i class="fas fa-check"></i>
                            Valider le rechargement
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>
{% endblock %}
